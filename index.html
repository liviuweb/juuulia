<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julia, kommst du Sonntag mit F1 schauen?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#16161b;
    --asphalt-hell:#24242c;
    --rot:#e8302f;
    --rot-tief:#8f1413;
    --weiss:#f2f2f0;
    --grau:#9a99a6;
    --gruen:#3ec46d;
    --dunkel:#0d0d11;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    font-family:"Press Start 2P", ui-monospace, "Courier New", monospace;
    background:var(--asphalt);
    color:var(--weiss);
    display:grid;place-items:center;
    padding:24px 16px;
    overflow:hidden;
    line-height:1.9;
    -webkit-font-smoothing:none;
  }

  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 112%, rgba(232,48,47,.22), transparent 62%);
  }

  .karte{
    position:relative;z-index:1;
    width:min(640px,100%);
    background:var(--asphalt-hell);
    padding:0 26px 30px;
    text-align:center;
    box-shadow:
      0 -8px 0 0 var(--asphalt-hell), 0 8px 0 0 var(--asphalt-hell),
      -8px 0 0 0 var(--asphalt-hell), 8px 0 0 0 var(--asphalt-hell),
      0 -12px 0 0 var(--rot-tief), 0 12px 0 0 var(--rot-tief),
      -12px 0 0 0 var(--rot-tief), 12px 0 0 0 var(--rot-tief);
  }

  /* Zielflaggen-Streifen oben in der Karte */
  .streifen{
    height:16px;margin:0 -26px 26px;
    background:
      repeating-conic-gradient(var(--weiss) 0 25%, var(--dunkel) 0 50%)
      0 0/16px 16px;
  }

  /* Startampel */
  .ampel{
    display:flex;justify-content:center;gap:10px;
    margin-bottom:24px;
  }
  .lampe{
    width:22px;height:22px;
    background:#000;
    box-shadow:inset 3px 3px 0 rgba(255,255,255,.09), inset -3px -3px 0 rgba(0,0,0,.5), 0 0 0 3px #3a3a44;
  }
  .lampe.an{background:var(--rot);box-shadow:inset 3px 3px 0 rgba(255,255,255,.3), inset -3px -3px 0 rgba(0,0,0,.35), 0 0 0 3px #3a3a44, 0 0 18px rgba(232,48,47,.7)}
  .lampe.gruen{background:var(--gruen);box-shadow:inset 3px 3px 0 rgba(255,255,255,.3), inset -3px -3px 0 rgba(0,0,0,.35), 0 0 0 3px #3a3a44, 0 0 18px rgba(62,196,109,.7)}

  h1{
    font-size:clamp(13px,3.4vw,19px);
    font-weight:400;line-height:2;letter-spacing:.5px;
    text-wrap:balance;
  }
  h1 .zeile2{display:block;color:var(--rot);margin-top:10px}
  .fertig h1 .zeile2{color:var(--gruen)}

  .buehne{
    display:flex;align-items:flex-end;justify-content:center;
    margin:30px 0 26px;min-height:132px;
  }
  .tier{width:112px;position:relative;transition:transform .45s steps(6,end)}
  .tier svg{display:block;width:100%;height:auto}
  .traene{
    position:absolute;left:24%;top:52%;width:9px;
    opacity:0;pointer-events:none;
    animation:traenchen .9s steps(5,end) forwards;
  }
  @keyframes traenchen{
    0%{opacity:0;translate:0 -2px}
    25%{opacity:1;translate:0 0}
    70%{opacity:1;translate:0 12px}
    100%{opacity:0;translate:0 18px}
  }
  #hase{transform:scaleX(-1)}
  .tier.wippt{animation:wippen 1.6s steps(2,end) infinite}
  .tier.reagiert{animation:zucken .4s steps(4,end)}
  @keyframes wippen{0%,100%{translate:0 0}50%{translate:0 -4px}}
  @keyframes zucken{
    0%{translate:0 0} 25%{translate:-3px -5px} 50%{translate:3px 0}
    75%{translate:-2px -3px} 100%{translate:0 0}
  }

  .mitte{width:0;align-self:center;margin:0 4px;transition:width .35s steps(5,end)}
  .mitte svg{display:block;width:100%;height:auto}
  .mitte.an{width:58px;animation:puls 1s steps(2,end) infinite}
  @keyframes puls{0%,100%{scale:1}50%{scale:1.2}}

  .wahl{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;min-height:64px}
  .btn{
    font-family:inherit;font-size:16px;line-height:1;
    color:var(--dunkel);background:var(--rot);
    border:0;padding:1em 1.4em;cursor:pointer;
    box-shadow:
      inset 4px 4px 0 rgba(255,255,255,.32),
      inset -4px -4px 0 rgba(0,0,0,.3),
      0 6px 0 var(--rot-tief);
    transition:font-size .3s steps(4,end), opacity .2s;
  }
  .btn:active{translate:0 4px;box-shadow:inset 4px 4px 0 rgba(255,255,255,.32), inset -4px -4px 0 rgba(0,0,0,.3), 0 2px 0 var(--rot-tief)}
  .btn:focus-visible{outline:4px solid var(--weiss);outline-offset:6px}
  .btn.nein{
    background:#4c4c58;color:var(--weiss);
    box-shadow:inset 4px 4px 0 rgba(255,255,255,.16), inset -4px -4px 0 rgba(0,0,0,.3), 0 6px 0 #2b2b33;
  }
  .btn.nein:active{box-shadow:inset 4px 4px 0 rgba(255,255,255,.16), inset -4px -4px 0 rgba(0,0,0,.3), 0 2px 0 #2b2b33}

  .btn.ja.uebernahme{
    position:fixed;inset:0;z-index:40;width:100%;height:100%;padding:0;
    box-shadow:inset 10px 10px 0 rgba(255,255,255,.26), inset -10px -10px 0 rgba(0,0,0,.28);
  }
  .btn.ja.uebernahme:active{translate:0 0}

  .hinweis{margin-top:22px;font-size:10px;line-height:2;color:var(--grau);min-height:20px}

  .neustart{
    margin-top:20px;background:none;border:0;cursor:pointer;
    font-family:inherit;font-size:10px;color:var(--grau);
    text-decoration:underline;padding:6px;
  }
  .neustart:focus-visible{outline:3px solid var(--weiss);outline-offset:4px}

  #regen{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  #regen .fall{position:absolute;top:-60px;animation:fallen linear forwards}
  #regen .fall svg{display:block;width:100%;height:auto}
  @keyframes fallen{to{transform:translateY(114vh) rotate(var(--dreh))}}

  @media (max-width:430px){
    .tier{width:88px}
    .btn{font-size:14px}
    .karte{padding:0 18px 24px}
    .streifen{margin:0 -18px 22px}
    .lampe{width:17px;height:17px}
    .ampel{gap:8px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<main class="karte" id="karte">
  <div class="streifen" aria-hidden="true"></div>

  <div class="ampel" id="ampel" aria-hidden="true">
    <div class="lampe"></div><div class="lampe"></div><div class="lampe"></div>
    <div class="lampe"></div><div class="lampe"></div>
  </div>

  <h1 id="frage">Julia, kommst du Sonntag <span class="zeile2">mit F1 schauen?</span></h1>

  <div class="buehne" aria-hidden="true">
    <div class="tier" id="katze"></div>
    <div class="mitte" id="mitte"></div>
    <div class="tier" id="hase"></div>
  </div>

  <div class="wahl" id="wahl">
    <button class="btn ja" id="ja">Ja!</button>
    <button class="btn nein" id="nein">Nein</button>
  </div>

  <p class="hinweis" id="hinweis"></p>
</main>

<div id="regen" aria-hidden="true"></div>

<script>
/* ------------------------------------------------------------------
   Alles zum Anpassen steht hier oben.
------------------------------------------------------------------ */
const NAME = 'Julia';   // hier den Namen ändern, der Rest passt sich an

const TEXTE = {
  frage:     [NAME + ', kommst du Sonntag', 'mit F1 schauen?'],
  ja:        'Ja!',
  nein:      ['Nein', 'Sicher?', 'Ganz sicher?', 'Allein ist das langweilig',
              'Bitte?', 'Boxenstopp zum Nachdenken',
              'Letzte Runde', 'Jetzt aber wirklich'],
  hinweise:  ['', 'Der Ja-Button hat da eine Meinung zu.', '', 'DRS aktiviert.',
              'Du siehst, wohin das führt.', '', 'Letzte Runde.', ''],
  erfolg:    'Wusste ich doch.',
  erfolgSub: 'Ich freu mich.',
  nochmal:   'Nochmal fragen'
};

/* ------------------------------------------------------------------
   Pixel-Sprites: eine Zeile = eine Pixelreihe, ein Zeichen = ein Pixel.
------------------------------------------------------------------ */
/* Kätzchen: einfarbig grau, Brust und Schnauze eine Spur heller. */
const KATZE = {
  farben:{O:'#2f2833', B:'#8f8a9b', N:'#8f8a9b', W:'#c8c4d2', P:'#ff8fb3', K:'#2f2833'},
  rumpf:[
    '................',
    '..OO........OO..',
    '.OBBO......ONNO.',
    '.OBPBO....ONPNO.',
    '.OBBBOOOOOONNNO.',
    '..OBBBBBWNNNNO..',
    '.OBBBBWWWWNNNNO.',
    'AUGE1','AUGE2',
    '.OBBBWWPPWWNNNO.',
    '.OBBBWWWWWWNNNO.',
    '..OBBWWWWWWNNO..',
    '...OOWWWWWWOO...',
    '....OWWWWWWO....',
    '....OWWWWWWO....',
    '....OOOOOOOO....'
  ],
  augen:{
    normal:    ['.OBBBKKWWNNKKNO.', '.OBBBKKWWNNKKNO.'],
    skeptisch: ['.OBBBBBWWNNNNNO.', '.OBBBKKWWNNKKNO.'],
    froh:      ['.OBBBKWWNNNNKNO.', '.OBBKBKWWNNKNKO.'],
    traurig:   ['.OBBKBKWWNNKNKO.', '.OBBBKWWNNNNKNO.']
  }
};

const HASE = {
  farben:{O:'#20202a', W:'#f6f4f8', P:'#ff8fb3', K:'#20202a'},
  rumpf:[
    'OHR1','OHR2','OHR3','OHR4','OHR5',
    '..OOWWWWWWWWOO..',
    '.OWWWWWWWWWWWWO.',
    'AUGE1','AUGE2',
    '.OWWWWWPPWWWWWO.',
    '.OWWWWWWWWWWWWO.',
    '..OWWWWWWWWWWO..',
    '...OWWWWWWWWO...',
    '...OWWWWWWWWO...',
    '...OWWWWWWWWO...',
    '...OOOOOOOOOO...'
  ],
  ohren:{
    normal:[
      '....OO..OO......',
      '...OWPO.OPWO....',
      '...OWPO.OPWO....',
      '...OWPO.OPWO....',
      '...OWWOOOWWO....'
    ],
    haengend:[
      '................',
      '..OWO......OWO..',
      '...OWPO.OPWO....',
      '...OWPO.OPWO....',
      '...OWWOOOWWO....'
    ]
  },
  augen:{
    normal:    ['.OWWWKKWWWWKKWO.', '.OWWWKKWWWWKKWO.'],
    skeptisch: ['.OWWWWWWWWWWWWO.', '.OWWWKKWWWWKKWO.'],
    froh:      ['.OWWWKWWWWWWKWO.', '.OWWKWKWWWWKWKO.'],
    traurig:   ['.OWWKWKWWWWKWKO.', '.OWWWKWWWWWWKWO.']
  }
};

/* Rennwagen von oben — so werden F1-Sprites üblicherweise gezeichnet:
   Frontflügel, schmale Nase, freistehende Räder, Cockpit, Heckflügel. */
const AUTO = {
  farben:{O:'#14141a', R:'#e8302f', W:'#f2f2f0', K:'#2a2a30', V:'#2b3a67'},
  rumpf:[
    '..OOOOOOOOOOOO..',
    '..OWWWWWWWWWWO..',
    '..ORRRRRRRRRRO..',
    '..OOOOOOOOOOOO..',
    '......ORRO......',
    '......ORRO......',
    '..OO..ORRO..OO..',
    '.OKKO.ORRO.OKKO.',
    '.OKKO.ORRO.OKKO.',
    '.OKKO.ORRO.OKKO.',
    '..OO..ORRO..OO..',
    '.....ORRRRO.....',
    '.....ORWWRO.....',
    '.....ORVVRO.....',
    '....ORRRRRRO....',
    '...ORRRRRRRRO...',
    '...ORRRRRRRRO...',
    '..OO.RRRRRR.OO..',
    '.OKKORRRRRROKKO.',
    '.OKKORRRRRROKKO.',
    '.OKKORRRRRROKKO.',
    '..OO.RRRRRR.OO..',
    '..OOOOOOOOOOOO..',
    '..ORRRRRRRRRRO..',
    '..OOOOOOOOOOOO..'
  ]
};

const HELM = {
  farben:{O:'#14141a', W:'#f2f2f0', R:'#e8302f', V:'#2b3a67'},
  rumpf:[
    '...OOOOOO...',
    '..OWWRRWWO..',
    '.OWWWRRWWWO.',
    'OWWWWRRWWWWO',
    'OWWWWWWWWWWO',
    'OOVVVVVVVVOO',
    'OOVVVVVVVVOO',
    'OWWWWWWWWWWO',
    'OWWWWWWWWWWO',
    '.OWWWWWWWWO.',
    '..OWWWWWWO..',
    '...OOOOOO...'
  ]
};

const FLAGGE = {
  farben:{A:'#f2f2f0', B:'#17171c'},
  rumpf:[
    'AABBAABB','AABBAABB','BBAABBAA','BBAABBAA',
    'AABBAABB','AABBAABB','BBAABBAA','BBAABBAA'
  ]
};

const HERZ = {
  farben:{O:'#5c1330', H:'#e8302f', L:'#ff8fa3'},
  rumpf:[
    '.OOO.OOO.',
    'OHLHOHHHO',
    'OHHHHHHHO',
    'OHHHHHHHO',
    '.OHHHHHO.',
    '..OHHHO..',
    '...OHO...',
    '....O....'
  ]
};

const TRAENE = {
  farben:{O:'#2b3a67', B:'#7fd4f5', L:'#e2f7ff'},
  rumpf:[
    '.OO.',
    'OLBO',
    'OLBO',
    'OBBO',
    '.OO.'
  ]
};

function zeichne(reihen, farben){
  const b = reihen[0].length, h = reihen.length;
  let s = `<svg viewBox="0 0 ${b} ${h}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">`;
  reihen.forEach((reihe, y) => {
    let x = 0;
    while (x < reihe.length){
      const z = reihe[x];
      if (z === '.'){ x++; continue; }
      let n = 1;
      while (x + n < reihe.length && reihe[x + n] === z) n++;
      s += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${farben[z]}"/>`;
      x += n;
    }
  });
  return s + '</svg>';
}

function tier(def, stimmung, ohrenArt){
  const augen = def.augen[stimmung] || def.augen.normal;
  const ohren = def.ohren ? (def.ohren[ohrenArt] || def.ohren.normal) : null;
  const reihen = def.rumpf.map(r => {
    if (r === 'AUGE1') return augen[0];
    if (r === 'AUGE2') return augen[1];
    if (ohren && r.startsWith('OHR')) return ohren[+r.slice(3) - 1];
    return r;
  });
  return zeichne(reihen, def.farben);
}

/* ------------------------------------------------------------------ */
const elKatze = document.getElementById('katze');
const elHase  = document.getElementById('hase');
const elMitte = document.getElementById('mitte');
const elJa    = document.getElementById('ja');
const elNein  = document.getElementById('nein');
const elFrage = document.getElementById('frage');
const elWahl  = document.getElementById('wahl');
const elHinw  = document.getElementById('hinweis');
const elKarte = document.getElementById('karte');
const elRegen = document.getElementById('regen');
const lampen  = [...document.querySelectorAll('.lampe')];

let stufe = 0;
const MAX = TEXTE.nein.length - 1;

function stimmungSetzen(s, ohren){
  elKatze.innerHTML = tier(KATZE, s);
  elHase.innerHTML  = tier(HASE, s, ohren || 'normal');
}

/* kurzes Zucken plus Tränchen bei jedem Klick */
function reagieren(){
  [elKatze, elHase].forEach(el => {
    el.classList.remove('reagiert');
    void el.offsetWidth;          // Animation neu starten
    el.classList.add('reagiert');

    const t = document.createElement('div');
    t.className = 'traene';
    t.innerHTML = zeichne(TRAENE.rumpf, TRAENE.farben);
    el.appendChild(t);
    setTimeout(() => t.remove(), 1000);
  });
}

function ampelSetzen(n){
  lampen.forEach((l, i) => {
    l.classList.remove('gruen');
    l.classList.toggle('an', i < n);
  });
}

function neinGeklickt(){
  if (stufe >= MAX) return;
  stufe++;

  elJa.style.fontSize   = (16 + stufe * 9) + 'px';
  elNein.style.fontSize = Math.max(9, 16 - stufe * 1.4) + 'px';
  elNein.textContent    = TEXTE.nein[stufe];
  elHinw.textContent    = TEXTE.hinweise[stufe] || '';

  ampelSetzen(Math.min(stufe, 5));

  const weg = Math.min(stufe * 7, 46);
  elKatze.style.transform = `translateX(${-weg}px)`;
  elHase.style.transform  = `scaleX(-1) translateX(${-weg}px)`;

  // je öfter Nein, desto geknickter
  const stimmung = stufe <= 2 ? 'skeptisch' : 'traurig';
  stimmungSetzen(stimmung, stufe >= 4 ? 'haengend' : 'normal');
  reagieren();

  if (stufe >= MAX){
    elJa.classList.add('uebernahme');
    elJa.style.fontSize = 'clamp(28px, 9vw, 64px)';
    elNein.style.opacity = '0';
    elNein.disabled = true;
    elNein.setAttribute('aria-hidden', 'true');
  }
}

function konfetti(){
  for (let i = 0; i < 32; i++){
    const t = document.createElement('div');
    t.className = 'fall';
    const arten = ['flagge', 'herz', 'auto', 'flagge', 'helm', 'herz'];
    const art = arten[i % arten.length];
    t.innerHTML = art === 'auto'  ? zeichne(AUTO.rumpf, AUTO.farben)
                : art === 'helm'  ? zeichne(HELM.rumpf, HELM.farben)
                : art === 'herz'  ? zeichne(HERZ.rumpf, HERZ.farben)
                :                   zeichne(FLAGGE.rumpf, FLAGGE.farben);
    t.style.left = Math.random() * 94 + '%';
    t.style.width = (art === 'auto' ? 24 + Math.random() * 14
                  :  art === 'helm' ? 20 + Math.random() * 12
                  :                   16 + Math.random() * 16) + 'px';
    t.style.animationDuration = (2.6 + Math.random() * 3.2) + 's';
    t.style.animationDelay = (Math.random() * 2.4) + 's';
    t.style.setProperty('--dreh', (Math.random() * 80 - 40) + 'deg');
    elRegen.appendChild(t);
  }
  setTimeout(() => { elRegen.innerHTML = ''; }, 9000);
}

function jaGeklickt(){
  elJa.classList.remove('uebernahme');
  elKarte.classList.add('fertig');
  elFrage.innerHTML = TEXTE.erfolg + '<span class="zeile2">' + TEXTE.erfolgSub + '</span>';

  // Lights out and away we go
  ampelSetzen(0);
  lampen.forEach(l => l.classList.add('gruen'));

  elKatze.style.transform = 'translateX(14px)';
  elHase.style.transform  = 'scaleX(-1) translateX(14px)';
  elKatze.classList.remove('reagiert');
  elHase.classList.remove('reagiert');
  elKatze.classList.add('wippt');
  elHase.classList.add('wippt');
  stimmungSetzen('froh');
  elMitte.innerHTML = zeichne(HERZ.rumpf, HERZ.farben);
  elMitte.classList.add('an');

  elWahl.innerHTML = '';
  const neu = document.createElement('button');
  neu.className = 'neustart';
  neu.textContent = TEXTE.nochmal;
  neu.addEventListener('click', zuruecksetzen);
  elWahl.appendChild(neu);
  elHinw.textContent = '';

  konfetti();
}

function zuruecksetzen(){
  stufe = 0;
  elKarte.classList.remove('fertig');
  elFrage.innerHTML = TEXTE.frage[0] + '<span class="zeile2">' + TEXTE.frage[1] + '</span>';
  ampelSetzen(0);
  elMitte.classList.remove('an');
  elMitte.innerHTML = '';
  elKatze.classList.remove('wippt', 'reagiert');
  elHase.classList.remove('wippt', 'reagiert');
  elKatze.style.transform = '';
  elHase.style.transform = 'scaleX(-1)';
  stimmungSetzen('normal');
  elHinw.textContent = '';

  elWahl.innerHTML = '';
  elJa.style.fontSize = '';
  elJa.classList.remove('uebernahme');
  elNein.style.fontSize = '';
  elNein.style.opacity = '';
  elNein.disabled = false;
  elNein.removeAttribute('aria-hidden');
  elNein.textContent = TEXTE.nein[0];
  elWahl.append(elJa, elNein);
}

elJa.textContent = TEXTE.ja;
elNein.textContent = TEXTE.nein[0];
elJa.addEventListener('click', jaGeklickt);
elNein.addEventListener('click', neinGeklickt);
stimmungSetzen('normal');
</script>
</body>
</html>
