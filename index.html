<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heute ist dein Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --himmel:#7cc9ea;
    --gras:#4aa356;
    --gras-tief:#2f7a3c;
    --karte:#f2f7ec;
    --rand:#2f7a3c;
    --rot:#e14b5a;
    --rot-tief:#a12836;
    --dunkel:#1b2b1e;
    --grau:#6f8570;
    --gelb:#ffd45c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Press Start 2P", ui-monospace, "Courier New", monospace;
    background:var(--himmel);
    color:var(--dunkel);
    display:grid;place-items:center;
    padding:24px 16px;overflow:hidden;
    line-height:1.9;-webkit-font-smoothing:none;
  }
  /* Rasen unten am Bildschirmrand */
  body::after{
    content:"";position:fixed;left:0;right:0;bottom:0;height:26%;z-index:0;
    background:
      repeating-linear-gradient(90deg, var(--gras) 0 22px, #45994f 22px 44px);
    border-top:6px solid var(--gras-tief);
  }

  .karte{
    position:relative;z-index:1;width:min(620px,100%);
    background:var(--karte);padding:32px 26px 28px;text-align:center;
    box-shadow:
      0 -8px 0 0 var(--karte), 0 8px 0 0 var(--karte),
      -8px 0 0 0 var(--karte), 8px 0 0 0 var(--karte),
      0 -12px 0 0 var(--rand), 0 12px 0 0 var(--rand),
      -12px 0 0 0 var(--rand), 12px 0 0 0 var(--rand);
  }

  h1{
    font-size:clamp(13px,3.4vw,19px);font-weight:400;
    line-height:2;letter-spacing:.5px;text-wrap:balance;
  }
  h1 b{display:block;color:var(--rot);font-weight:400;margin-top:10px}

  /* Bühne */
  .buehne{
    position:relative;display:flex;align-items:flex-end;justify-content:center;
    gap:26px;margin:34px 0 8px;min-height:150px;
  }
  .figur{position:relative;width:104px}
  .figur svg{display:block;width:100%;height:auto}
  #hase{transform:scaleX(-1)}
  .schild{
    position:absolute;left:-34px;bottom:52px;width:56px;
    transform:rotate(-8deg);transition:transform .15s steps(2,end);
  }
  .schild svg{display:block;width:100%;height:auto}
  .jubelt .schild{transform:rotate(8deg) translateY(-6px)}
  .figur.hopst{animation:hopsen .45s steps(3,end)}
  @keyframes hopsen{0%{translate:0 0}40%{translate:0 -12px}70%{translate:0 -3px}100%{translate:0 0}}

  .ball{position:absolute;right:-6px;bottom:0;width:26px}
  .ball svg{display:block;width:100%;height:auto}
  .ball.rollt{animation:kicken .55s steps(4,end)}
  @keyframes kicken{0%{translate:0 0;rotate:0deg}50%{translate:26px -30px;rotate:180deg}100%{translate:0 0;rotate:360deg}}

  /* Sprechblase */
  .ruf{
    position:absolute;left:50%;top:-6px;translate:-50% 0;
    background:var(--gelb);color:var(--dunkel);
    padding:12px 14px;font-size:12px;white-space:nowrap;
    opacity:0;pointer-events:none;
    box-shadow:0 -5px 0 0 var(--gelb), 0 5px 0 0 var(--gelb),
               -5px 0 0 0 var(--gelb), 5px 0 0 0 var(--gelb),
               0 -8px 0 0 var(--dunkel), 0 8px 0 0 var(--dunkel),
               -8px 0 0 0 var(--dunkel), 8px 0 0 0 var(--dunkel);
  }
  .ruf.an{animation:rufen 1.1s steps(6,end) forwards}
  @keyframes rufen{
    0%{opacity:0;translate:-50% 8px;scale:.8}
    18%{opacity:1;translate:-50% 0;scale:1}
    75%{opacity:1;translate:-50% -6px}
    100%{opacity:0;translate:-50% -14px}
  }

  /* Lautstärke */
  .laut{display:flex;justify-content:center;gap:7px;margin:22px 0 6px}
  .laut div{width:34px;height:14px;background:#d7e2d2;box-shadow:inset 3px 3px 0 rgba(0,0,0,.08)}
  .laut div.an{background:var(--rot);box-shadow:inset 3px 3px 0 rgba(255,255,255,.35), inset -3px -3px 0 rgba(0,0,0,.2)}
  .lautText{font-size:8px;color:var(--grau);letter-spacing:1px}

  .knopf{margin-top:20px}
  .btn{
    font-family:inherit;font-size:16px;line-height:1;color:#fff;
    background:var(--rot);border:0;padding:1.1em 1.5em;cursor:pointer;
    box-shadow:inset 4px 4px 0 rgba(255,255,255,.3),
               inset -4px -4px 0 rgba(0,0,0,.25), 0 7px 0 var(--rot-tief);
  }
  .btn:active{translate:0 5px;box-shadow:inset 4px 4px 0 rgba(255,255,255,.3), inset -4px -4px 0 rgba(0,0,0,.25), 0 2px 0 var(--rot-tief)}
  .btn:focus-visible{outline:4px solid var(--dunkel);outline-offset:6px}
  .neustart{
    background:none;border:0;cursor:pointer;font-family:inherit;
    font-size:9px;color:var(--grau);text-decoration:underline;padding:8px;
  }
  .zuspruch{
    margin-top:22px;font-size:clamp(14px,4vw,21px);line-height:1.9;
    color:var(--rot);text-wrap:balance;display:none;
  }
  .zuspruch.an{display:block;animation:zeigen .4s steps(4,end)}
  @keyframes zeigen{from{opacity:0;scale:.9}to{opacity:1;scale:1}}
  .hinweis{margin-top:18px;font-size:9px;line-height:2;color:var(--grau);min-height:18px}

  #regen{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  #regen .fall{position:absolute;top:-50px;animation:fallen linear forwards}
  #regen .fall svg{display:block;width:100%;height:auto}
  @keyframes fallen{to{transform:translateY(115vh) rotate(var(--dreh))}}

  @media (max-width:430px){
    .figur{width:82px}
    .buehne{gap:16px}
    .schild{width:46px;left:-26px}
    .btn{font-size:14px}
    .laut div{width:26px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<main class="karte" id="karte">
  <h1 id="titel">Heute ist dein Spiel. <b>Ich freu mich schon drauf, dich zu sehen!</b></h1>

  <div class="buehne" aria-hidden="true">
    <div class="ruf" id="ruf"></div>
    <div class="figur" id="katzeBox">
      <div class="schild" id="schild"></div>
      <div id="katze"></div>
    </div>
    <div class="figur" id="haseBox">
      <div id="hase"></div>
      <div class="ball" id="ball"></div>
    </div>
  </div>

  <div class="laut" id="laut" aria-hidden="true"></div>
  <p class="lautText" id="lautText">LAUTSTÄRKE</p>

  <div class="knopf" id="knopf">
    <button class="btn" id="feuern">ANFEUERN</button>
  </div>

  <p class="zuspruch" id="zuspruch"></p>

  <p class="hinweis" id="hinweis"></p>
</main>

<div id="regen" aria-hidden="true"></div>

<script>
/* ==================================================================
   Texte — hier anpassen
================================================================== */
const TEXTE = {
  titel:   ['Heute ist dein Spiel.', 'Ich freu mich schon drauf, dich zu sehen!'],
  rufe:    ['LOS!', 'JAAA!', "ZEIG'S IHNEN!", 'DU SCHAFFST DAS!', "AUF GEHT'S!"],
  hinweise:['Drück drauf. Ich üb schon mal.',
            'Geht lauter.',
            'Die Nachbarn hören schon mit.',
            'Noch einmal.',
            ''],
  knopf:   'ANFEUERN',
  endTitel:['Viel Glück heute Abend.', 'Ich steh irgendwo an der Seite und schau dir zu.'],
  endHinweis:'In echt bin ich leiser. Aber ich bin da.',
  endRuf:  'TOOOR!',
  nochmal: 'Nochmal anfeuern',
  zuspruch:'Ich weiß, dass du das super machen wirst!'
};

/* ==================================================================
   Pixel-Sprites
================================================================== */
const KATZE = {
  farben:{O:'#2f2833', B:'#8f8a9b', N:'#8f8a9b', W:'#c8c4d2', P:'#ff8fb3', K:'#2f2833', F:'#e14b5a', G:'#ffd45c'},
  rumpf:[
    '................','..OO........OO..','.OBBO......ONNO.','.OBPBO....ONPNO.',
    '.OBBBOOOOOONNNO.','..OBBBBBWNNNNO..','.OBBBBWWWWNNNNO.','AUGE1','AUGE2',
    '.OBBBWWPPWWNNNO.','.OBBBWWWWWWNNNO.','..OBBWWWWWWNNO..',
    '...OOFFGGFFOO...',   /* Schal */
    '....OFFGGFFO....',
    '....OWWWWWWOFFO.',   /* Schalende hängt raus */
    '....OOOOOOOOOFO.'
  ],
  augen:{
    normal: ['.OBBBKKWWNNKKNO.', '.OBBBKKWWNNKKNO.'],
    froh:   ['.OBBBKWWNNNNKNO.', '.OBBKBKWWNNKNKO.']
  }
};

const HASE = {
  farben:{O:'#2f2833', W:'#f6f4f8', P:'#ff8fb3', K:'#2f2833', J:'#e14b5a', Z:'#f6f4f8'},
  rumpf:[
    '....OO..OO......','...OWPO.OPWO....','...OWPO.OPWO....','...OWPO.OPWO....',
    '...OWWOOOWWO....','..OOWWWWWWWWOO..','.OWWWWWWWWWWWWO.','AUGE1','AUGE2',
    '.OWWWWWPPWWWWWO.','.OWWWWWWWWWWWWO.','..OWWWWWWWWWWO..',
    '...OJJJJJJJJO...',   /* Trikot */
    '...OJJJZZJJJO...',
    '...OJJJZZJJJO...',
    '...OOOOOOOOOO...'
  ],
  augen:{
    normal: ['.OWWWKKWWWWKKWO.', '.OWWWKKWWWWKKWO.'],
    froh:   ['.OWWWKWWWWWWKWO.', '.OWWKWKWWWWKWKO.']
  }
};

const SCHILD = {
  farben:{O:'#2f2833', W:'#f6f4f8', H:'#e14b5a', S:'#8a5a34'},
  rumpf:[
    'OOOOOOOOOOOOOO','OWWWWWWWWWWWWO','OWWHHWWWWHHWWO','OWHHHHWHHHHHWO',
    'OWHHHHHHHHHHWO','OWWHHHHHHHHWWO','OWWWHHHHHHWWWO','OWWWWHHHHWWWWO',
    'OWWWWWHHWWWWWO','OOOOOOOOOOOOOO','......OSSO....','......OSSO....','......OSSO....'
  ]
};

const BALL = {
  farben:{O:'#2f2833', W:'#f6f4f8', K:'#2f2833'},
  rumpf:[
    '..OOOOO..','.OWWWWWO.','OWWKKKWWO','OWKKKKKWO','OWWKKKWWO',
    'OWWWWWWWO','OWWKWWKWO','.OWWWWWO.','..OOOOO..'
  ]
};

const HERZ = {
  farben:{O:'#8c2348', H:'#e14b5a', L:'#ff9ab0'},
  rumpf:['.OOO.OOO.','OHLHOHHHO','OHHHHHHHO','OHHHHHHHO','.OHHHHHO.','..OHHHO..','...OHO...','....O....']
};

function zeichne(reihen, farben){
  const b = reihen[0].length, h = reihen.length;
  let s = `<svg viewBox="0 0 ${b} ${h}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">`;
  reihen.forEach((reihe, y) => {
    let x = 0;
    while (x < reihe.length){
      const z = reihe[x];
      if (z === '.'){ x++; continue; }
      let n = 1;
      while (x + n < reihe.length && reihe[x + n] === z) n++;
      s += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${farben[z]}"/>`;
      x += n;
    }
  });
  return s + '</svg>';
}

function figur(def, stimmung){
  const a = def.augen[stimmung] || def.augen.normal;
  return zeichne(def.rumpf.map(r => r === 'AUGE1' ? a[0] : r === 'AUGE2' ? a[1] : r), def.farben);
}

/* ==================================================================
   Ablauf
================================================================== */
const elKatze = document.getElementById('katze');
const elHase  = document.getElementById('hase');
const elKatzeBox = document.getElementById('katzeBox');
const elHaseBox  = document.getElementById('haseBox');
const elRuf   = document.getElementById('ruf');
const elLaut  = document.getElementById('laut');
const elBall  = document.getElementById('ball');
const elTitel = document.getElementById('titel');
const elHinw  = document.getElementById('hinweis');
const elKnopf = document.getElementById('knopf');
const elFeuern= document.getElementById('feuern');
const elRegen = document.getElementById('regen');

const STUFEN = 5;
let stufe = 0;

function gesichter(s){
  elKatze.innerHTML = figur(KATZE, s);
  elHase.innerHTML  = figur(HASE, s);
}

function lautBauen(){
  elLaut.innerHTML = '';
  for (let i = 0; i < STUFEN; i++){
    const d = document.createElement('div');
    if (i < stufe) d.className = 'an';
    elLaut.appendChild(d);
  }
}

function neuStarten(el, klasse){
  el.classList.remove(klasse);
  void el.offsetWidth;
  el.classList.add(klasse);
}

function rufen(text){
  elRuf.innerHTML = text;
  neuStarten(elRuf, 'an');
}

function konfetti(anzahl){
  for (let i = 0; i < anzahl; i++){
    const t = document.createElement('div');
    t.className = 'fall';
    t.innerHTML = i % 3 === 0 ? zeichne(HERZ.rumpf, HERZ.farben) : zeichne(BALL.rumpf, BALL.farben);
    t.style.left = Math.random() * 94 + '%';
    t.style.width = (16 + Math.random() * 16) + 'px';
    t.style.animationDuration = (2.4 + Math.random() * 3) + 's';
    t.style.animationDelay = (Math.random() * 2.2) + 's';
    t.style.setProperty('--dreh', (Math.random() * 90 - 45) + 'deg');
    elRegen.appendChild(t);
  }
  setTimeout(() => { elRegen.innerHTML = ''; }, 9000);
}

function feuern(){
  if (stufe >= STUFEN) return;
  rufen(TEXTE.rufe[stufe]);
  stufe++;
  lautBauen();
  gesichter('froh');
  elKatzeBox.classList.add('jubelt');
  neuStarten(elKatzeBox, 'hopst');
  neuStarten(elHaseBox, 'hopst');
  neuStarten(elBall, 'rollt');
  elHinw.textContent = TEXTE.hinweise[stufe - 1] || '';
  if (stufe >= STUFEN) setTimeout(schluss, 700);
}

function schluss(){
  elTitel.innerHTML = TEXTE.endTitel[0] + '<b>' + TEXTE.endTitel[1] + '</b>';
  elHinw.textContent = TEXTE.endHinweis;
  document.getElementById('lautText').textContent = 'MAXIMUM';
  rufen(TEXTE.endRuf);
  konfetti(30);
  elKnopf.innerHTML = '';
  const neu = document.createElement('button');
  neu.className = 'neustart';
  neu.textContent = TEXTE.nochmal;
  neu.addEventListener('click', zuruecksetzen);
  elKnopf.appendChild(neu);
  const zu = document.getElementById('zuspruch');
  zu.textContent = TEXTE.zuspruch;
  zu.classList.add('an');
}

function zuruecksetzen(){
  document.getElementById('zuspruch').classList.remove('an');
  stufe = 0;
  lautBauen();
  gesichter('normal');
  elKatzeBox.classList.remove('jubelt');
  elTitel.innerHTML = TEXTE.titel[0] + '<b>' + TEXTE.titel[1] + '</b>';
  elHinw.textContent = TEXTE.hinweise[0];
  document.getElementById('lautText').textContent = 'LAUTSTÄRKE';
  elKnopf.innerHTML = '';
  elFeuern.textContent = TEXTE.knopf;
  elKnopf.appendChild(elFeuern);
}

document.getElementById('schild').innerHTML = zeichne(SCHILD.rumpf, SCHILD.farben);
elBall.innerHTML = zeichne(BALL.rumpf, BALL.farben);
elFeuern.addEventListener('click', feuern);
gesichter('normal');
lautBauen();
elHinw.textContent = TEXTE.hinweise[0];
</script>
</body>
</html>
